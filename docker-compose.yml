services:
  postgres:
    image: postgres:16-alpine
    container_name: foundry-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry
    volumes:
      - foundry_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  opa:
    image: openpolicyagent/opa:latest
    container_name: foundry-opa
    restart: unless-stopped
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --watch
      - --log-level=debug
      - /policies
    ports:
      - "8181:8181"
    volumes:
      - ./opa/policies:/policies:ro

volumes:
  foundry_pg_data:
